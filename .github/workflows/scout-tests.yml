name: scout tests
on:
  push:
    paths: ['scout/**', 'requirements.txt', '.github/workflows/scout-tests.yml']
  pull_request:
    paths: ['scout/**', 'requirements.txt', '.github/workflows/scout-tests.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Offline: every reader is fed a canned response. No network, no key, no mail.
      - run: python -m unittest discover -s scout -v
