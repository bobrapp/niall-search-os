# Niall Search OS scout config
# Sources, one per target (the first one set is used):
#   greenhouse: boards-api.greenhouse.io board token
#   lever:      api.lever.co token
#   ashby:      jobs.ashbyhq.com board name - CASE-SENSITIVE ("Vantage", not "vantage")
#   bamboohr:   the <name> in <name>.bamboohr.com
#   workday:    "<host>/<tenant>/<site>" from the careers URL
# Search sources, for employers too large to list whole. Each takes one query or a
# list of queries and keeps the newest results per query:
#   amazon:     amazon.jobs search
#   microsoft:  careers search - ONE request per run (it rate-limits), so the
#               queries are joined into a single search
#   ibm:        careers.ibm.com search
# With no source set the scout guesses a Greenhouse token from the company name;
# a 404 means the guess is wrong - confirm the real one from that company's job URLs.
# custom_ats: true lists a target separately for manual checking in the run log.
# Tokens below were confirmed against each company's careers page on 2026-11-24.

candidate_profile: profile.md
digest_to: bobrapp@gmail.com

# Title filter, applied case-insensitively as word matches.
title_must_match_any:
  - director
  - head
  - vp
  - vice president
  - principal
  - chief
  - transformation
  - governance
  - finops
  - cloud
title_none_any:
  - intern
  - junior
  - engineer i
  - engineer ii
  - recruiter
  - coordinator
  - associate

max_tokens_per_digest: 4000

# Postings scored below this are counted in the digest but not listed.
# profile.md defines 4-6 as "plausible but sideways" and 1-3 as below scope.
min_fit_in_digest: 4

targets:
  - name: Microsoft
    microsoft: finops cloud cost governance
  - name: Amazon Web Services
    amazon: [finops, cloud financial management, ai governance]
  - name: Google Cloud
    custom_ats: true
    note: no public job search to read - check google.com/about/careers by hand
  - name: IBM (Apptio)
    ibm: [apptio, finops, director]
  - name: Flexera
    workday: flexerasoftware.wd1.myworkdayjobs.com/flexerasoftware/FlexeraSoftware
  - name: CloudZero
    ashby: CloudZero
  - name: Vantage
    ashby: Vantage
  - name: Credo AI
    ashby: credo.ai
  - name: Holistic AI
    bamboohr: holisticai
  - name: Monitaur
    custom_ats: true
    note: no job board - roles are listed by hand at monitaur.ai/company#careers
